<div class="login-container">
    <h2>Login</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          [class.invalid]="form.get('username')?.invalid && form.get('username')?.touched"
        >
        <div class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          Username is required
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        >
        <div class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password is required
        </div>
      </div>
  
      <button type="submit" [disabled]="form.invalid">Login</button>
    </form>
  </div>
