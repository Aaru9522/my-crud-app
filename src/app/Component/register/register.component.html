<div class="register-container">
    <h2>Register</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div>
        <label>Username</label>
        <input formControlName="username" />
        <div *ngIf="submitted && form.get('username')?.hasError('required')" class="error">
          Username is required
        </div>
      </div>
  
      <div>
        <label>Email</label>
        <input formControlName="email" />
        <div *ngIf="submitted && form.get('email')?.errors" class="error">
          <div *ngIf="form.get('email')?.hasError('required')">Email is required</div>
          <div *ngIf="form.get('email')?.hasError('email')">Invalid email</div>
        </div>
      </div>
  
      <div>
        <label>Password</label>
        <input type="password" formControlName="password" />
        <div *ngIf="submitted && form.get('password')?.errors" class="error">
          <div *ngIf="form.get('password')?.hasError('required')">Password is required</div>
          <div *ngIf="form.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </div>
        </div>
      </div>
  
      <button type="submit">Register</button>
    </form>
  </div>
