<div class="centered">
  <mat-card class="full-width">
    <mat-card-header>
      <mat-card-title>Users</mat-card-title>
      <mat-card-subtitle>
        <button mat-flat-button color="accent" (click)="newUser()">
          <mat-icon>person_add</mat-icon>
          New User
        </button>
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="users" class="mat-elevation-z8 full-width">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let u">{{u.id}}</td>
        </ng-container>

        <!-- Username Column -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Username</th>
          <td mat-cell *matCellDef="let u">{{u.username}}</td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{u.email}}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let u">
            <button mat-icon-button color="primary" (click)="editUser(u.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteUser(u.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id','username','email','actions']"></tr>
        <tr mat-row        *matRowDef="let row; columns: ['id','username','email','actions'];"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
